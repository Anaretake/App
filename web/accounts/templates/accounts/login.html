
<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Авторизация</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {

            background-color: #f7fbff;
            font-family: Arial, sans-serif;
            color: #243746;

        }


        .top-panel {

            background-color: #e8f4ff;
            border-bottom: 1px solid #c9e3f7;
            padding: 18px 30px;

        }


        .project-title {

            font-size: 22px;
            font-weight: 600;
            color: #246b9e;
            margin: 0;

        }


        .main-container {

            max-width: 500px;
            margin: 80px auto;
            padding: 0 20px;

        }


        .login-section {

            background-color: white;
            border: 1px solid #d8eaf7;
            border-radius: 8px;
            padding: 30px;

        }


        .section-title {

            font-size: 18px;
            font-weight: 600;
            color: #246b9e;
            margin-bottom: 25px;

        }


        .form-label {

            color: #6c7a86;
            font-size: 14px;

        }


        .form-control {

            border: 1px solid #d8eaf7;
            border-radius: 6px;
            padding: 10px 12px;

        }


        .form-control:focus {

            border-color: #4da3d9;
            box-shadow: 0 0 0 0.15rem rgba(77, 163, 217, 0.15);

        }


        .btn-blue {

            background-color: #4da3d9;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 6px;
            width: 100%;

        }


        .btn-blue:hover {

            background-color: #368fc7;
            color: white;

        }


        .error-message {

            margin-bottom: 15px;
            padding: 10px 12px;
            background-color: #fff4f4;
            border: 1px solid #f0d0d0;
            border-radius: 6px;
            color: #a65b5b;
            font-size: 14px;

        }

    </style>

</head>


<body>


    <div class="top-panel">

        <div class="project-title">
            Обработка КТ
        </div>

    </div>


    <div class="main-container">

        <div class="login-section">

            <div class="section-title">
                Авторизация
            </div>


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Логин
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Пароль
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required
                    >

                </div>


                {% if error %}

                    <div class="error-message">
                        {{ error }}
                    </div>

                {% endif %}


                <button
                    type="submit"
                    class="btn btn-blue"
                >
                    Войти
                </button>


            </form>

        </div>

    </div>


</body>

</html>
